name: 'Deploy to AWS S3'
description: 'Deploy static website via AWS S3'
inputs:
  bucket:
    description: 'The S3 bucket name'
    required: true
  bucket-region:
    description: 'The region S3 bucket resides'
    required: false
    default: 'us-east-1'
  dist-folder:
   description: 'Path to folder containing deployable files'
   required: true
runs:
  using: 'node16'
  main: 'main.js'