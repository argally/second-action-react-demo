name: Stale Issues & PRs
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  stale:
    permissions:
      contents: write # only for delete-branch option
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v8
        with:
          stale-issue-message: "This is some message."
          days-before-stale: 1
          days-before-close: 5
